name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VULKAN_SDK_VERSION: 1.4.328.1
  VULKAN_SDK_SHA256: a8675df6d538079c2a719a9373994948091db785b48f142e024254e76348d16c

jobs:
  runtime:
    name: Runtime and tests (no Qt)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkansdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK checksum mismatch" }
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          & $installer --root $root --accept-licenses --default-answer --confirm-command install | Out-Host
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DHEPHAESTUS_USE_QT=OFF -DHEPHAESTUS_BUILD_EDITOR=OFF

      - name: Build
        run: cmake --build build/ci --config Release --parallel

      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure

      - name: Check the packaged game has no Qt dependency
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents build/ci/Release/HephaestusGame.exe
          $deps | Out-Host
          if ($deps -match 'Qt6') { throw "HephaestusGame.exe depends on Qt" }

  editor:
    name: Editor and tests (Qt)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkansdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK checksum mismatch" }
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          & $installer --root $root --accept-licenses --default-answer --confirm-command install | Out-Host
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.10.2
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-release "-DQt6_DIR=$env:QT_ROOT_DIR/lib/cmake/Qt6"

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --test-dir build/windows-release -C Release --output-on-failure
