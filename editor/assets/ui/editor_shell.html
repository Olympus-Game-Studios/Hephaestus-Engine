<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hephaestus Editor</title>
  <link rel="stylesheet" href="./ui_theme.css" />
  <style>
    :root {
      --shell-bg: #141922;
    }
    html, body {
      margin: 0;
      background: transparent;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .shell-menu {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 12px;
      background: #0f141c;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .shell-toolbar {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #151b25;
      border-bottom: 1px solid var(--border);
    }
    .shell-toolbar .ui-btn {
      height: 26px;
    }
    .shell-main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 280px 1fr 360px;
      grid-template-rows: 1fr;
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
    }
    .dock-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }
    .panel-slot {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 0;
      flex: 1;
    }
    .panel-frame {
      border: 0;
      width: 100%;
      height: 100%;
    }
    #viewport-slot {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex: 1.4;
      min-height: 0;
    }
    .center-top {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      flex: 1.4;
    }
    .panel-overlay {
      position: absolute;
      inset: 0;
      display: none;
      z-index: 10;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel-overlay.is-open {
      display: block;
    }
    .project-manager-overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 50;
      background: var(--panel);
    }
    .project-manager-overlay.is-open {
      display: block;
    }
    .shell-status {
      height: 22px;
      font-size: 11px;
      color: var(--muted2);
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid var(--border);
      background: #0f141c;
    }
    .menu-item { cursor: pointer; }

    /* Project Manager (direct) styles */
    .pm-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--panel);
    }
    .pm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(45, 140, 255, 0.15), transparent), var(--header);
      border-bottom: 1px solid var(--border);
    }
    .pm-brand { display: flex; flex-direction: column; gap: 4px; }
    .pm-title { font-size: 18px; font-weight: 700; letter-spacing: 0.4px; }
    .pm-subtitle { font-size: 12px; color: var(--muted2); }
    .pm-header-actions { display: flex; gap: 10px; align-items: center; }
    .pm-btn {
      padding: 8px 14px;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      background: var(--panel2);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pm-btn:hover { border-color: var(--border); background: rgba(255,255,255,0.05); }
    .pm-btn.primary {
      background: rgba(26, 163, 255, 0.18);
      border-color: rgba(26, 163, 255, 0.6);
      color: var(--accent);
    }
    .pm-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 20px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .pm-search { flex: 1; min-width: 240px; }
    .pm-search input {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      background: #242b37;
      color: var(--text);
      font-size: 12px;
      box-sizing: border-box;
    }
    .pm-search input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(26, 163, 255, 0.35);
    }
    .pm-select {
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      background: #242b37;
      color: var(--text);
      font-size: 12px;
    }
    .pm-view-toggle {
      display: inline-flex;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .pm-view-toggle button {
      padding: 6px 10px;
      background: transparent;
      color: var(--text);
      border: none;
      cursor: pointer;
      font-size: 12px;
    }
    .pm-view-toggle button.is-active {
      background: rgba(26, 163, 255, 0.2);
      color: var(--accent);
    }
    .pm-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .pm-scroll { flex: 1; overflow: auto; padding: 18px 20px 30px; }
    .pm-projects-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }
    .pm-projects-list { display: flex; flex-direction: column; gap: 10px; }
    .pm-project-card {
      border: 1px solid #2b3342;
      border-radius: 12px;
      background: #1b202b;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .pm-project-card.is-selected {
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(20, 120, 255, 0.25);
    }
    .pm-project-card:hover {
      background: #222a38;
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .pm-project-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pm-project-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pm-project-fav { border: none; background: transparent; color: var(--muted2); cursor: pointer; font-size: 16px; }
    .pm-project-fav.is-active { color: var(--accent2); }
    .pm-project-desc { font-size: 12px; color: var(--muted2); line-height: 1.4; min-height: 34px; }
    .pm-project-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted2); }
    .pm-project-tag { border: 1px solid var(--border2); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--muted); }
    .pm-project-footer { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .pm-empty {
      border: 1px dashed var(--border2);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: var(--muted2);
      background: rgba(255,255,255,0.02);
    }
    .pm-status {
      padding: 8px 20px;
      font-size: 12px;
      color: var(--muted2);
      border-top: 1px solid var(--border);
      background: var(--panel2);
    }
    .pm-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }
    .pm-modal.is-open { display: flex; }
    .pm-modal-card {
      width: min(520px, 92vw);
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pm-modal-card h3 { margin: 0; font-size: 14px; }
    .pm-field label { display: block; font-size: 12px; color: var(--muted2); margin-bottom: 6px; }
    .pm-field input, .pm-field textarea, .pm-field select {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      background: #242b37;
      color: var(--text);
      font-size: 12px;
      box-sizing: border-box;
    }
    .pm-field textarea { min-height: 80px; resize: vertical; }
    .pm-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .pm-row { display: flex; gap: 8px; align-items: center; }
    .pm-row input { flex: 1; }
  </style>
</head>
<body>
  <div class="project-manager-overlay" id="panel-project-manager"></div>
  <div class="shell-menu">
    <div class="menu-item">File</div>
    <div class="menu-item">Edit</div>
    <div class="menu-item">Window</div>
    <div class="menu-item">Help</div>
  </div>
  <div class="shell-toolbar">
    <button class="ui-btn" id="btn-open-blueprint">Blueprint Editor</button>
    <button class="ui-btn" id="btn-refresh-scene">Refresh Scene</button>
  </div>

  <div class="shell-main" id="shell-main">
    <div class="dock-column" id="left-dock">
      <div class="panel-slot" id="panel-outliner"></div>
      <div class="panel-slot" id="panel-add-actors"></div>
    </div>

    <div class="dock-column" id="center-dock">
      <div class="center-top">
        <div id="viewport-slot"></div>
        <div class="panel-overlay" id="panel-blueprint"></div>
      </div>
      <div class="panel-slot" id="panel-asset-browser"></div>
    </div>

    <div class="dock-column" id="right-dock">
      <div class="panel-slot" id="panel-details"></div>
      <div class="panel-slot" id="panel-log"></div>
    </div>
  </div>

  <div class="shell-status" id="shell-status">Ready</div>

  <script src="./ui_common.js"></script>
  <script src="./editor_api.js"></script>
  <script src="./panel_host.js"></script>
  <script src="./editor_shell.js"></script>
</body>
</html>
